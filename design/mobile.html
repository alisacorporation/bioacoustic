<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice2clip · Android mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------ tokens */
  .t-neon {
    --bg:#0b0e13; --panel:#11151c; --panel2:#161b24; --line:#1f2632; --hl:#1f2632;
    --text:#e6ebf2; --muted:#7d8899; --dim:#4c5666; --label:#5b6678;
    --a1:#3ee6ff; --a2:#9b6bff; --on:#071017; --rec:#ff4d6a; --ok:#3ddc97; --busy:#ffb547;
    --glow:rgba(62,230,255,.10); --stripe:transparent;
  }
  .t-umbrella {
    --bg:#070708; --panel:#0f0f11; --panel2:#151517; --line:#26262a; --hl:#3a0a12;
    --text:#f2f2f2; --muted:#8e8e93; --dim:#5a5a60; --label:#b3101f;
    --a1:#ff1f3d; --a2:#a00018; --on:#fff; --rec:#e4002b; --ok:#f2f2f2; --busy:#ff7a1a;
    --glow:rgba(228,0,43,.14); --stripe:#1a0508;
  }
  .t-hive {
    --bg:#030303; --panel:#09090a; --panel2:#0e0e0f; --line:#1c1c1f; --hl:#2a0509;
    --text:#e8e6e6; --muted:#807c7d; --dim:#4d494a; --label:#7a0a16;
    --a1:#b3001b; --a2:#4a0008; --on:#fff; --rec:#9e0018; --ok:#e8e6e6; --busy:#c2410c;
    --glow:rgba(140,0,20,.16); --stripe:#120204;
  }

  * { box-sizing:border-box; margin:0; padding:0; border-radius:0 !important; }
  html,body { background:#000; }
  body {
    font-family:"Golos Text", sans-serif; color:#ddd; -webkit-font-smoothing:antialiased;
    display:flex; gap:40px; padding:36px 40px; flex-wrap:nowrap; justify-content:center; align-items:flex-start;
    background:radial-gradient(1400px 900px at 50% 0%, #15171c 0%, #000 70%);
  }
  body.single { padding:0; gap:0; background:#000; }
  .cap { font:500 11px "JetBrains Mono"; color:#5a5f6a; letter-spacing:2px; text-transform:uppercase; margin-top:14px; text-align:center; }
  body.single .cap { display:none; }

  /* ------------------------------------------------------------------ phone */
  .phone {
    position:relative; width:390px; height:844px; overflow:hidden;
    background:var(--bg); color:var(--text);
    display:grid; grid-template-rows:30px 56px 1fr auto 124px;
    box-shadow:0 0 0 1px #1d1f24, 0 50px 120px -30px rgba(0,0,0,.9);
  }
  body.single .phone { box-shadow:none; }
  /* grain + scanlines */
  .phone::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:5; opacity:.07; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .t-umbrella::after, .t-hive::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }

  .sbar { display:flex; align-items:center; justify-content:space-between; padding:0 18px; font:500 12px "JetBrains Mono"; color:var(--muted); }
  .sbar i { display:inline-block; width:14px; height:8px; border:1px solid var(--muted); margin-left:6px; position:relative; }
  .sbar i::after { content:""; position:absolute; inset:1px 4px 1px 1px; background:var(--muted); }

  header { display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--hl); }
  .logo { width:30px; height:30px; flex:none; display:grid; place-items:center; }
  .brand { font:600 11px "Unbounded"; letter-spacing:1.5px; white-space:nowrap; text-transform:uppercase; line-height:1.1; }
  .brand small { display:block; font:400 9.5px "JetBrains Mono"; letter-spacing:1.5px; color:var(--dim); margin-top:3px; }
  .t-neon .brand { letter-spacing:.6px; text-transform:none; font-weight:600; }
  .status { margin-left:auto; display:flex; align-items:center; gap:7px; font:500 10.5px "JetBrains Mono"; letter-spacing:1px;
            padding:6px 9px; border:1px solid var(--line); background:var(--panel); color:var(--muted); text-transform:uppercase; }
  .dot { width:7px; height:7px; border-radius:50% !important; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .s-recording .dot { background:var(--rec); box-shadow:0 0 10px var(--rec); animation:blink 1s infinite; }
  .s-transcribing .dot { background:var(--busy); box-shadow:0 0 10px var(--busy); }
  @keyframes blink { 50% { opacity:.3 } }

  /* ------------------------------------------------------------------ scope */
  .scope { position:relative; margin:14px 14px 0; border:1px solid var(--line); background:
           radial-gradient(70% 60% at 50% 50%, var(--glow), transparent 70%), var(--panel); overflow:hidden; min-height:0; }
  .scope .br { position:absolute; width:14px; height:14px; border-color:var(--a1); border-style:solid; opacity:.9; z-index:2; }
  .br.tl { top:6px; left:6px; border-width:2px 0 0 2px } .br.tr { top:6px; right:6px; border-width:2px 2px 0 0 }
  .br.bl { bottom:6px; left:6px; border-width:0 0 2px 2px } .br.brr { bottom:6px; right:6px; border-width:0 2px 2px 0 }
  .read { position:absolute; z-index:3; font:500 9.5px "JetBrains Mono"; letter-spacing:1.6px; color:var(--dim); text-transform:uppercase; }
  .read.tl { top:14px; left:28px; color:var(--label) } .read.tr { top:14px; right:28px }
  .read.bl { bottom:14px; left:28px } .read.br2 { bottom:14px; right:28px }
  .scope canvas { position:absolute; inset:0; width:100%; height:100%; }
  .timer { position:absolute; z-index:3; left:0; right:0; bottom:38px; text-align:center; font:600 34px "Unbounded"; letter-spacing:2px; color:var(--text); }
  .s-idle .timer, .s-transcribing .timer, .s-history .timer { color:var(--dim); }
  .meter { position:absolute; z-index:3; left:28px; right:28px; bottom:28px; height:3px; background:var(--panel2); }
  .meter i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--a2), var(--a1)); }
  .seg { position:absolute; z-index:3; top:28px; right:22px; display:flex; border:1px solid var(--line); background:var(--bg); }
  .seg span { font:500 9.5px "JetBrains Mono"; letter-spacing:1px; padding:5px 8px; color:var(--dim); }
  .seg span.on { background:var(--panel2); color:var(--text); }

  /* ------------------------------------------------------------------ card */
  .card-wrap { padding:14px 14px 0; }
  .lrow { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .label { font:600 9.5px "JetBrains Mono"; letter-spacing:2.2px; color:var(--label); text-transform:uppercase; }
  .unpin { font:500 10px "JetBrains Mono"; color:var(--dim); letter-spacing:1px; }
  .card { position:relative; border:1px solid var(--line); border-top:2px solid var(--a1); background:linear-gradient(180deg, var(--panel2), var(--panel)); padding:14px 14px 12px; }
  .card.pinned { border-left:2px solid var(--a1); }
  .card p { font-size:15.5px; line-height:1.5; min-height:70px; max-height:118px; overflow:hidden; }
  .card .foot { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .meta { font:400 10.5px "JetBrains Mono"; color:var(--dim); white-space:nowrap; }
  .copy { margin-left:auto; display:flex; align-items:center; gap:8px; padding:11px 16px; font:600 13px "Golos Text";
          background:linear-gradient(90deg, var(--a1), var(--a2)); color:var(--on); box-shadow:0 10px 24px -12px var(--a1); }
  .copy svg { width:15px; height:15px; }
  .copy.done { background:var(--ok); color:var(--bg); }
  .shimmer { display:grid; gap:11px; min-height:70px; padding-top:4px; }
  .shimmer i { height:11px; background:linear-gradient(90deg, var(--panel2) 0%, var(--hl) 45%, var(--panel2) 90%); background-size:300% 100%; animation:sh 1.3s infinite linear; }
  @keyframes sh { from { background-position:100% 0 } to { background-position:-200% 0 } }

  /* ------------------------------------------------------------------ history */
  .hist { margin:14px 14px 0; display:grid; grid-template-rows:auto 1fr; min-height:0; }
  .hhead { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .count { font:400 10.5px "JetBrains Mono"; color:var(--dim); }
  .search { margin-left:auto; width:150px; display:flex; gap:7px; align-items:center; padding:8px 10px; border:1px solid var(--line); background:var(--panel); font-size:12px; color:var(--dim); }
  .list { overflow:hidden; mask-image:linear-gradient(180deg,#000 82%,transparent); }
  .day { font:600 9px "JetBrains Mono"; letter-spacing:2px; color:var(--dim); padding:12px 4px 6px; }
  .row { display:grid; grid-template-columns:54px 1fr 40px; align-items:center; height:48px; border:1px solid transparent; }
  .row time { font:400 11px "JetBrains Mono"; color:var(--dim); padding-left:8px; }
  .row span { font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .ic { display:grid; place-items:center; color:var(--dim); height:100%; }
  .row .ic svg { width:16px; height:16px; }
  .row.sel { background:var(--panel2); border-color:var(--a2); box-shadow:inset 2px 0 0 var(--a1); }
  .row.sel span { color:var(--text); }
  .row.sel .ic { color:var(--a1); }

  /* ------------------------------------------------------------------ dock */
  .dock { display:grid; grid-template-columns:1fr 128px 1fr; align-items:center; padding-bottom:18px; border-top:1px solid var(--hl); position:relative;
          background:linear-gradient(180deg, var(--bg), var(--panel)); }
  .dock::after { content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
                 background:repeating-linear-gradient(135deg, var(--stripe) 0 8px, transparent 8px 16px); }
  .dbtn { display:grid; justify-items:center; gap:6px; color:var(--muted); font:500 9px "JetBrains Mono"; letter-spacing:1.6px; text-transform:uppercase; }
  .dbtn svg { width:22px; height:22px; }
  .dbtn.on { color:var(--a1); }
  .hint { position:absolute; bottom:10px; left:0; right:0; text-align:center; font:500 9.5px "JetBrains Mono"; letter-spacing:1.6px; color:var(--dim); text-transform:uppercase; }

  /* record button */
  .rec { position:relative; width:96px; height:96px; margin:0 auto; display:grid; place-items:center; }
  .rec .body { width:72px; height:72px; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--rec) 55%, #fff), var(--rec) 70%);
               box-shadow:0 0 0 6px color-mix(in srgb, var(--rec) 22%, transparent), 0 14px 40px -12px var(--rec); transition:all .3s; }
  .rec .ring { position:absolute; inset:12px; border:1.5px solid var(--rec); opacity:0; }
  .s-recording .rec .ring { animation:radar 1.6s infinite cubic-bezier(.2,.6,.3,1); }
  .s-recording .rec .ring:nth-child(2) { animation-delay:.53s } .s-recording .rec .ring:nth-child(3) { animation-delay:1.06s }
  @keyframes radar { 0% { transform:scale(1); opacity:.9 } 100% { transform:scale(1.75); opacity:0 } }
  .rec .inner { position:absolute; display:none; }
  .s-recording .rec .inner { display:grid; place-items:center; }
  .s-recording .rec .body { width:60px; height:60px; }
  .t-umbrella.s-recording .rec .body, .t-hive.s-recording .rec .body { opacity:0; }
  .emblem { width:66px; height:66px; animation:spin 2.2s linear infinite; filter:drop-shadow(0 0 14px color-mix(in srgb, var(--rec) 70%, transparent)); }
  @keyframes spin { to { transform:rotate(360deg) } }
  .eq { display:flex; gap:4px; align-items:center; height:40px; }
  .eq b { width:5px; background:#fff; animation:eq .7s infinite ease-in-out alternate; }
  .eq b:nth-child(1){animation-delay:-.1s} .eq b:nth-child(2){animation-delay:-.35s} .eq b:nth-child(3){animation-delay:-.6s}
  .eq b:nth-child(4){animation-delay:-.2s} .eq b:nth-child(5){animation-delay:-.45s}
  @keyframes eq { from { height:8px } to { height:36px } }
  .t-neon .emblem-wrap { display:none } .t-umbrella .eq, .t-hive .eq { display:none }

  .toast { position:absolute; z-index:6; left:50%; top:96px; transform:translateX(-50%); display:flex; gap:8px; align-items:center;
           padding:9px 14px; background:var(--panel2); border:1px solid color-mix(in srgb, var(--ok) 40%, transparent); color:var(--ok); font-size:12.5px; white-space:nowrap; }
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);
const ONLY = P.get('only');                 // e.g. "recording" → single phone, for screenshots
const THEME = P.get('theme') || 'umbrella'; // neon | umbrella | hive
const FREEZE = P.has('t') ? parseFloat(P.get('t')) : null;
if (ONLY) document.body.classList.add('single');

const PAL = {
  neon:     ['#3ee6ff', '#9b6bff', '#ff5fa8', '#5b8cff'],
  umbrella: ['#ff1f3d', '#b0001e', '#f2f2f2', '#ff6b4a'],
  hive:     ['#b3001b', '#6e000f', '#d8d4d4', '#8c1c10'],
};
const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12"/><path d="M5 15V3h12"/></svg>',
  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><path d="M13 13h8v8h-8z" fill="currentColor"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>',
};

function emblem(size, neon) {
  if (neon) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ee6ff"/><stop offset="1" stop-color="#9b6bff"/></linearGradient></defs><rect x="1" y="1" width="22" height="22" fill="url(#ng)"/><path d="M6 11v2M9 8v8M12 5v14M15 8v8M18 11v2" stroke="#071017" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  let s = '';
  const c = 12, r = 10.2, R = 11.4;
  const pt = (k, rad) => { const a = (k * 45 - 112.5) * Math.PI / 180; return `${c + rad * Math.cos(a)} ${c + rad * Math.sin(a)}`; };
  let rim = 'M' + pt(0, R); for (let k = 1; k < 8; k++) rim += ' L' + pt(k, R); rim += 'Z';
  for (let i = 0; i < 8; i++) s += `<path d="M12 12 L${pt(i, r)} L${pt(i + 1, r)}Z" fill="url(#${i % 2 ? 'ew' : 'er'})"/>`;
  for (let i = 0; i < 8; i++) s += `<path d="M12 12 L${pt(i, r)}" stroke="#1a0004" stroke-width=".35"/>`;
  return `<svg class="emb" width="${size}" height="${size}" viewBox="0 0 24 24"><defs>
    <radialGradient id="er"><stop offset="0" stop-color="#e3102c"/><stop offset=".55" stop-color="#a3001a"/><stop offset="1" stop-color="#420007"/></radialGradient>
    <radialGradient id="ew"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#e9e6e6"/><stop offset="1" stop-color="#a9a3a4"/></radialGradient></defs>
    <path d="${rim}" fill="#1a0004"/>${s}<circle cx="12" cy="12" r="1.5" fill="#1a0004"/></svg>`;
}

const HIST = [
  ['СЕГОДНЯ'], ['14:02', 'Купить хлеб, молоко и не забыть забрать посылку на почте'],
  ['13:58', 'Позвонить Андрею насчёт встречи в четверг, уточнить адрес и время', 'sel'],
  ['13:40', 'Заметка: проверить логи сервиса после обновления'], ['12:15', 'git commit с сообщением про исправление пути к whisper'],
  ['ВЧЕРА'], ['21:47', 'Идея для бота: команда быстрого поиска по истории'], ['19:03', 'Обновить драйвер Vulkan для RX 580'],
  ['18:30', 'Фильмы на выходные: Дюна, Интерстеллар'], ['11:12', 'Ответить на письмо до конца недели'], ['09:05', 'Записаться к стоматологу'],
];
const LONG = 'Позвонить Андрею насчёт встречи в четверг, уточнить адрес и время. Взять с собой ноутбук и распечатки договора, обсудить сроки по второму этапу.';
const TEXT = 'Привет! Это тест мобильной версии voice2clip — волна, история и копирование прямо с телефона.';

function phone(state, theme) {
  const corp = theme !== 'neon';
  const brand = corp ? `UMBRELLA · VOICE2CLIP<small>${theme === 'hive' ? 'UMBRELLA DARK' : 'BIOACOUSTIC UNIT'} · v2</small>` : `voice2clip<small>NEON · v2</small>`;
  const status = { idle: 'Готов', recording: 'Запись', transcribing: 'Распознаю', result: 'Готов', history: 'Готов' }[state];
  const timer = state === 'recording' ? '00:04.2' : (state === 'transcribing' ? '00:04.2' : '00:00.0');
  const level = state === 'recording' ? 78 : 6;

  let card;
  if (state === 'transcribing') card = '<div class="shimmer"><i style="width:94%"></i><i style="width:80%"></i><i style="width:52%"></i></div>';
  else if (state === 'idle') card = `<p style="color:var(--dim)">Удерживайте кнопку и говорите — текст появится здесь.</p>`;
  else if (state === 'history') card = `<p>${LONG}</p>`;
  else card = `<p>${TEXT}</p>`;
  const copied = state === 'result';

  const middle = state === 'history' ? `
    <section class="hist">
      <div class="hhead"><span class="label">История</span><span class="count">2 199</span><div class="search">${ICON.search}Поиск…</div></div>
      <div class="list">${HIST.map(h => h.length === 1 ? `<div class="day">${h[0]}</div>`
        : `<div class="row ${h[2] || ''}"><time>${h[0]}</time><span>${h[1]}</span><div class="ic">${ICON.copy}</div></div>`).join('')}</div>
    </section>` : `
    <section class="scope">
      <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
      <div class="read tl">Голос · live</div><div class="read tr">CH-01 · 16 kHz</div>
      <div class="seg"><span class="on">Волна</span><span>Спектр</span></div>
      <canvas data-theme="${theme}" data-state="${state}"></canvas>
      <div class="timer">${timer}</div>
      <div class="meter"><i style="width:${level}%"></i></div>
      <div class="read bl">-60 dB</div><div class="read br2">${state === 'recording' ? '-9 dB' : '-58 dB'}</div>
    </section>`;

  const cardBlock = `
    <section class="card-wrap">
      <div class="lrow"><span class="label">${state === 'history' ? 'Выбрано · сегодня 13:58' : 'Сейчас'}</span>${state === 'history' ? '<span class="unpin">✕ к последней</span>' : ''}</div>
      <div class="card ${state === 'history' ? 'pinned' : ''}">${card}
        <div class="foot"><span class="meta">${state === 'history' ? '24 слова' : (state === 'idle' ? '—' : '4.2 s · whisper 1.3 s')}</span>
          <div class="copy ${copied ? 'done' : ''}">${copied ? ICON.check + 'Скопировано' : ICON.copy + 'Копировать'}</div></div>
      </div>
    </section>`;

  const hint = { idle: 'Удерживайте · или тап', recording: 'Отпустите — распознать', transcribing: 'whisper работает…', result: 'Удерживайте · или тап', history: 'Тап по строке — выбрать · ⧉ копировать' }[state];

  return `
  <div>
  <div class="phone t-${theme} s-${state}">
    <div class="sbar"><span>14:05</span><span>LTE ▴▴▴<i></i></span></div>
    <header><div class="logo">${emblem(30, !corp)}</div><div class="brand">${brand}</div>
      <div class="status"><span class="dot"></span>${status}</div></header>
    ${state === 'history' ? cardBlock + middle : middle + cardBlock}
    <footer class="dock">
      <div class="hint">${hint}</div>
      <div class="dbtn ${state === 'history' ? 'on' : ''}">${ICON.hist}История</div>
      <div class="rec"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="body"></div>
        <div class="inner"><div class="emblem-wrap"><div class="emblem">${emblem(66, false)}</div></div><div class="eq"><b></b><b></b><b></b><b></b><b></b></div></div></div>
      <div class="dbtn">${ICON.theme}Тема</div>
    </footer>
    ${copied ? `<div class="toast">${ICON.check}Скопировано в буфер обмена</div>` : ''}
  </div>
  <div class="cap">${theme} · ${state}</div>
  </div>`;
}

const STATES = ONLY ? [ONLY] : ['idle', 'recording', 'transcribing', 'result', 'history'];
document.body.innerHTML = STATES.map(s => phone(s, THEME)).join('');

/* ---------------- waves (same model as the desktop widget) ---------------- */
function level(state, t) {
  if (state !== 'recording') return state === 'transcribing' ? 0.07 : 0.04;
  const syl = Math.pow(Math.max(0, Math.sin(t * 5.3) * 0.6 + Math.sin(t * 2.1 + 1) * 0.5), 1.4);
  return 0.25 + 0.75 * syl;
}
const canvases = [...document.querySelectorAll('canvas')].map(cv => {
